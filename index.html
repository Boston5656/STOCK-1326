<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --card-dark: #121212;
      --border-gray: #2C2C2E;
      --text-main: #FFFFFF;
      --text-sub: #8E8E93;
      --accent-yellow: #FFD60A;
      --apple-red: #FF453A;
      --apple-blue: #0A84FF;
    }

    body {
      background-color: var(--bg-black);
      font-family: 'Sarabun', -apple-system, sans-serif;
      color: var(--text-main);
      padding: 15px 0 80px 0;
    }

    .font-mono {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.5px;
    }

    .menu-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 20px auto;
      background: var(--card-dark);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid var(--border-gray);
    }
    .menu-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .menu-btn.active {
      background: var(--accent-yellow);
      color: #000000;
      font-weight: 700;
    }

    .price-check-card {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--card-dark);
      border: 1px solid var(--border-gray);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
    }

    .card-title-badge {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-yellow-scan {
      background-color: var(--accent-yellow);
      color: #000000;
      font-weight: 700;
      border-radius: 16px;
      padding: 14px;
      border: none;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 4px 20px rgba(255, 214, 10, 0.2);
    }
    .btn-yellow-scan:active { transform: scale(0.98); }

    .search-input-group {
      display: flex;
      background: #000000;
      border: 1px solid var(--border-gray);
      border-radius: 14px;
      padding: 4px;
      margin-top: 12px;
    }
    .search-input {
      background: transparent;
      border: none;
      color: white;
      padding: 10px 14px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }
    .btn-search-sm {
      background: var(--border-gray);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .reader-box {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--accent-yellow);
      background: #000;
    }

    .scan-flash {
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin-top: 15px;
      font-weight: 700;
      display: none;
    }
    .flash-success { background-color: rgba(10, 132, 255, 0.2); border: 1px solid var(--apple-blue); color: var(--apple-blue); }
    .flash-error { background-color: rgba(255, 69, 58, 0.2); border: 1px solid var(--apple-red); color: var(--apple-red); }
    .flash-warning { background-color: rgba(255, 214, 10, 0.2); border: 1px solid var(--accent-yellow); color: var(--accent-yellow); }

    .badge-complete { background-color: var(--apple-blue); color: white; border-radius: 8px; padding: 4px 10px; font-weight: 600; font-size: 0.75rem;}
    .badge-incomplete { background-color: var(--apple-red); color: white; border-radius: 8px; padding: 4px 10px; font-weight: 600; font-size: 0.75rem;}
  </style>
</head>
<body>
  <div class="container">

    <!-- ช่องตั้งค่าลิงก์เชื่อมต่อ Apps Script -->
    <div class="price-check-card mb-3" id="configCard">
      <div class="card-title-badge font-mono text-warning">⚙️ เชื่อมต่อระบบหลังบ้าน</div>
      <p class="text-sub small text-start">วางลิงก์ Web App (ที่ลงท้ายด้วย /exec จาก Google Apps Script):</p>
      <div class="search-input-group">
        <input type="text" id="scriptUrlInput" class="search-input" placeholder="https://script.google.com/macros/s/.../exec">
        <button class="btn-search-sm bg-warning text-dark fw-bold" onclick="saveScriptUrl()">บันทึก</button>
      </div>
    </div>

    <div class="menu-bar font-mono">
      <button class="menu-btn active" id="menu100" onclick="switchTab('100')">📦 นับ 100%</button>
      <button class="menu-btn" id="menuRand" onclick="switchTab('rand')">🎲 นับสุ่ม</button>
      <button class="menu-btn" id="menuRep" onclick="switchTab('report')">🔍 สรุปผล</button>
    </div>

    <!-- TAB 1: นับ 100% -->
    <div class="tab-content-area" id="area100">
      <div class="price-check-card">
        <div class="card-title-badge font-mono">📷 FULL INVENTORY AUDIT (100%)</div>

        <div id="initBox100">
          <button class="btn-yellow-scan font-mono" onclick="initInventory('FULL', '100')">
            🗂️ โหลดข้อมูลและเริ่มระบบ
          </button>
        </div>

        <div id="activeBox100" style="display:none;">
          <button class="btn-yellow-scan font-mono mb-3 py-2 fs-6" onclick="startCamera('100')">📸 เปิดกล้องสแกน</button>
          <div id="reader100" class="reader-box" style="display:none;"></div>
          <button id="closeCam100" class="btn btn-sm btn-dark w-100 mb-2 text-sub" style="display:none;" onclick="stopCamera('100')">ปิดกล้อง</button>

          <div class="search-input-group">
            <input type="text" id="manualInput100" class="search-input" placeholder="หรือพิมพ์รหัส/Serial แล้วกด Enter..." onkeypress="handleManualInput(event, '100')">
            <button class="btn-search-sm" onclick="processManualInput('100')">ค้นหา</button>
          </div>

          <div id="scanStatus100" class="scan-flash font-mono"></div>

          <hr class="border-secondary my-3 opacity-25">
          <div class="d-flex justify-content-between text-sub font-mono small mb-2">
             <span>ความคืบหน้า</span>
             <span id="countProgress100" class="text-white fw-bold">0/0</span>
          </div>
          <ul class="list-group text-start font-mono small mb-3" id="liveList100" style="max-height: 220px; overflow-y: auto; background: transparent;"></ul>

          <button class="btn btn-danger w-100 font-mono fw-bold py-2 rounded-4" onclick="finishCount('100%', '100')">💾 จบการนับ และบันทึก REPORT</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: นับสุ่ม -->
    <div class="tab-content-area" id="arearand" style="display:none;">
      <div class="price-check-card">
        <div class="card-title-badge font-mono">🎲 RANDOM INVENTORY AUDIT</div>

        <div id="initBoxrand">
          <button class="btn-yellow-scan font-mono" onclick="initInventory('RANDOM', 'rand')">
            🗂️ โหลดข้อมูลและเริ่มระบบ
          </button>
        </div>

        <div id="activeBoxrand" style="display:none;">
          <button class="btn-yellow-scan font-mono mb-3 py-2 fs-6" onclick="startCamera('rand')">📸 เปิดกล้องสแกน</button>
          <div id="readerrand" class="reader-box" style="display:none;"></div>
          <button id="closeCamrand" class="btn btn-sm btn-dark w-100 mb-2 text-sub" style="display:none;" onclick="stopCamera('rand')">ปิดกล้อง</button>

          <div class="search-input-group">
            <input type="text" id="manualInputrand" class="search-input" placeholder="หรือพิมพ์รหัส/Serial แล้วกด Enter..." onkeypress="handleManualInput(event, 'rand')">
            <button class="btn-search-sm" onclick="processManualInput('rand')">ค้นหา</button>
          </div>

          <div id="scanStatusrand" class="scan-flash font-mono"></div>

          <hr class="border-secondary my-3 opacity-25">
          <div class="d-flex justify-content-between text-sub font-mono small mb-2">
             <span>ความคืบหน้า</span>
             <span id="countProgressrand" class="text-white fw-bold">0/0</span>
          </div>
          <ul class="list-group text-start font-mono small mb-3" id="liveListrand" style="max-height: 220px; overflow-y: auto; background: transparent;"></ul>

          <button class="btn btn-danger w-100 font-mono fw-bold py-2 rounded-4" onclick="finishCount('สุ่ม', 'rand')">💾 จบการนับ และบันทึก REPORT</button>
        </div>
      </div>
    </div>

    <!-- TAB 3: REPORT -->
    <div class="tab-content-area" id="areareport" style="display:none;">
      <div class="price-check-card">
        <div class="card-title-badge font-mono">📊 REPORT HISTORY</div>
        <div id="reportContainer">
          <div class="text-center text-sub py-4 font-mono">กำลังโหลดรายงาน...</div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let activeScanners = {};
    let scanCooldown = false;
    let inventoryMap = {};
    let productRequiresSN = {};
    let totalExpected = {};
    let totalCounted = {};

    window.onload = function() {
      let savedUrl = localStorage.getItem('gas_url');
      if (savedUrl) {
        document.getElementById('scriptUrlInput').value = savedUrl;
        document.getElementById('configCard').style.display = 'none';
      }
    };

    function saveScriptUrl() {
      let url = document.getElementById('scriptUrlInput').value.trim();
      if(!url) { alert('กรุณากรอกลิงก์'); return; }
      localStorage.setItem('gas_url', url);
      document.getElementById('configCard').style.display = 'none';
      alert('บันทึกการเชื่อมต่อสำเร็จ!');
    }

    function getApiUrl() {
      return localStorage.getItem('gas_url');
    }

    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        if (type === 'success') {
          osc.type = 'sine'; osc.frequency.value = 880; osc.start(); setTimeout(()=>osc.stop(), 120);
        } else {
          osc.type = 'square'; osc.frequency.value = 220; osc.start(); setTimeout(()=>osc.stop(), 250);
        }
      } catch(e) {}
    }

    function switchTab(tab) {
      stopAllCameras();
      ['100', 'rand', 'report'].forEach(t => {
        let btnKey = t === '100' ? '100' : (t === 'rand' ? 'Rand' : 'Rep');
        document.getElementById('menu' + btnKey).classList.remove('active');
        document.getElementById('area' + t).style.display = 'none';
      });
      let activeBtnKey = tab === '100' ? '100' : (tab === 'rand' ? 'Rand' : 'Rep');
      document.getElementById('menu' + activeBtnKey).classList.add('active');
      document.getElementById('area' + tab).style.display = 'block';

      if(tab === 'report') loadReport();
    }

    // ใช้ Google Script Runner / JSONP พลังทะลวงทุก CORS
    function callGAS(action, params, callback) {
      let url = getApiUrl();
      let callbackName = 'cb_' + Math.round(Math.random() * 1000000);
      
      window[callbackName] = function(res) {
        delete window[callbackName];
        if(document.getElementById(scriptId)) document.getElementById(scriptId).remove();
        callback(res);
      };

      let scriptId = 'script_' + callbackName;
      let script = document.createElement('script');
      let paramStr = `action=${action}&callback=${callbackName}`;
      for(let k in params) {
        paramStr += `&${k}=${encodeURIComponent(params[k])}`;
      }
      script.id = scriptId;
      script.src = url + (url.includes('?') ? '&' : '?') + paramStr;
      script.onerror = function() {
        delete window[callbackName];
        if(document.getElementById(scriptId)) document.getElementById(scriptId).remove();
        callback({status: 'error', message: 'เชื่อมต่อหลังบ้านไม่สำเร็จ'});
      };
      document.body.appendChild(script);
    }

    function initInventory(sheetName, key) {
      let url = getApiUrl();
      if(!url) { alert('กรุณากรอกและบันทึก URL หลังบ้านด้านบนก่อนครับ'); return; }

      let initBox = document.getElementById('initBox' + key);
      let btn = initBox.querySelector('button');
      btn.innerText = '⏳ กำลังดึงข้อมูล...';
      btn.disabled = true;

      callGAS('getData', { sheet: sheetName }, function(res) {
        if (res && res.status === 'success') {
          buildInventoryMap(res.data, key);
          initBox.style.display = 'none';
          document.getElementById('activeBox' + key).style.display = 'block';
        } else {
          alert('Error: ' + (res ? res.message : 'Unknown error'));
          btn.innerText = '🗂️ โหลดข้อมูลและเริ่มระบบ';
          btn.disabled = false;
        }
      });
    }

    function buildInventoryMap(data, key) {
      inventoryMap[key] = {};
      productRequiresSN[key] = {};
      let exp = 0;

      data.forEach(item => {
        exp += item.sysQty;
        if (item.serial) {
          productRequiresSN[key][item.code] = true;
          inventoryMap[key][item.serial] = {
            type: 'device', code: item.code, name: item.name, serial: item.serial, 
            sysQty: 1, counted: 0, category: item.category
          };
        } else {
          if(!inventoryMap[key][item.code]) {
            inventoryMap[key][item.code] = {
              type: 'gadget', code: item.code, name: item.name, serial: null, 
              sysQty: 0, counted: 0, category: item.category
            };
          }
          inventoryMap[key][item.code].sysQty += item.sysQty;
        }
      });
      totalExpected[key] = exp;
      totalCounted[key] = 0;
      updateLiveList(key);
    }

    function startCamera(key) {
      let box = document.getElementById('reader' + key);
      let closeBtn = document.getElementById('closeCam' + key);
      box.style.display = 'block';
      closeBtn.style.display = 'block';

      if (activeScanners[key]) {
        try { activeScanners[key].clear(); } catch(e){}
      }

      activeScanners[key] = new Html5Qrcode('reader' + key);
      activeScanners[key].start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 120 } }, (decodedText) => {
        processScanCode(decodedText, key);
      }, (err) => {}).catch(err => {
        alert("ไม่สามารถเปิดกล้องได้: " + err);
      });
    }

    function stopCamera(key) {
      if (activeScanners[key]) {
        activeScanners[key].stop().then(() => {
          activeScanners[key].clear();
          activeScanners[key] = null;
        }).catch(e => { activeScanners[key] = null; });
      }
      document.getElementById('reader' + key).style.display = 'none';
      document.getElementById('closeCam' + key).style.display = 'none';
    }

    function stopAllCameras() {
      ['100', 'rand'].forEach(k => stopCamera(k));
    }

    function handleManualInput(e, key) {
      if (e.key === 'Enter') processManualInput(key);
    }

    function processManualInput(key) {
      let inputEl = document.getElementById('manualInput' + key);
      let val = inputEl.value.trim();
      if(val) {
        processScanCode(val, key);
        inputEl.value = '';
      }
    }

    function processScanCode(text, key) {
      if (scanCooldown) return;
      scanCooldown = true;

      let map = inventoryMap[key];
      let reqSN = productRequiresSN[key];
      let itemHandled = false;

      if (map[text] && map[text].type === 'device') {
        let itm = map[text];
        if (itm.counted >= 1) {
          flashUI("ซ้ำ! เครื่องนี้นับไปแล้ว", `SN: ${text}`, "error", key);
        } else {
          itm.counted = 1; totalCounted[key]++;
          flashUI("✅ ผ่าน!", `${itm.name} (SN: ${text})`, "success", key);
        }
        itemHandled = true;
      }
      else if (map[text] && map[text].type === 'gadget') {
        let itm = map[text];
        itm.counted++; totalCounted[key]++;
        if (itm.counted > itm.sysQty) {
          flashUI("⚠️ ยอดเกินระบบ!", `${itm.name} (${itm.counted}/${itm.sysQty})`, "warning", key);
        } else {
          flashUI("✅ ผ่าน!", `${itm.name} (${itm.counted}/${itm.sysQty})`, "success", key);
        }
        itemHandled = true;
      }
      else if (reqSN && reqSN[text]) {
        flashUI("❌ ระวัง!", "สินค้านี้ต้องสแกน IMEI หรือ SN เท่านั้น", "error", key);
        itemHandled = true;
      }

      if (!itemHandled) {
        flashUI("❌ ไม่พบรายการ!", `บาร์โค้ด [${text}] ไม่อยู่ในระบบ`, "error", key);
      }

      updateLiveList(key);
      setTimeout(() => { scanCooldown = false; }, 1500);
    }

    function flashUI(title, msg, type, key) {
      playBeep(type === 'success' || type === 'warning' ? 'success' : 'error');
      const box = document.getElementById('scanStatus' + key);
      box.className = `scan-flash flash-${type}`;
      box.innerHTML = `<span style="font-size:1.05rem">${title}</span><br><span style="font-weight:400; font-size:0.85rem">${msg}</span>`;
      box.style.display = 'block';
    }

    function updateLiveList(key) {
      let countedCurrent = 0;
      if(inventoryMap[key]) {
        Object.values(inventoryMap[key]).forEach(i => countedCurrent += i.counted);
      }
      document.getElementById('countProgress' + key).innerText = `${countedCurrent} / ${totalExpected[key] || 0}`;
      
      let html = '';
      if(inventoryMap[key]) {
        const arr = Object.values(inventoryMap[key]).filter(i => i.counted > 0 || i.sysQty > 0);
        arr.sort((a,b) => b.counted - a.counted).slice(0, 8).forEach(itm => {
          let color = itm.counted === itm.sysQty ? 'text-info' : (itm.counted > itm.sysQty ? 'text-warning' : 'text-danger');
          let lbl = itm.type === 'device' ? `SN: ${itm.serial}` : `Code: ${itm.code}`;
          html += `<li class="list-group-item d-flex justify-content-between align-items-center py-2 border-secondary border-opacity-25 bg-transparent text-white">
                     <div class="text-truncate" style="max-width:70%"><span>${itm.name}</span><br><small class="text-sub font-mono">${lbl}</small></div>
                     <span class="fw-bold font-mono ${color}">${itm.counted}/${itm.sysQty}</span>
                   </li>`;
        });
      }
      document.getElementById('liveList' + key).innerHTML = html;
    }

    function finishCount(labelType, key) {
      if(!confirm("ต้องการปิดรอบการนับและบันทึกรายงานใช่หรือไม่?")) return;
      stopAllCameras();

      let url = getApiUrl();
      const payloadData = [];
      Object.values(inventoryMap[key]).forEach(itm => {
        let diff = itm.counted - itm.sysQty;
        let status = diff === 0 ? 'ครบ' : (diff > 0 ? `เกิน ${diff}` : `ขาด ${Math.abs(diff)}`);
        payloadData.push({ category: itm.category, code: itm.code, name: itm.name, sysQty: itm.sysQty, counted: itm.counted, diff: diff, serial: itm.serial, status: status });
      });

      // ส่งข้อมูลบันทึกผ่าน JSONP ส่งข้ามโดเมน
      let payloadStr = encodeURIComponent(JSON.stringify({ type: `นับ ${labelType}`, data: payloadData }));
      callGAS('saveReport', { payload: payloadStr }, function(resp) {
        alert(resp.message || 'บันทึกรายงานสำเร็จ!');
        location.reload();
      });
    }

    function loadReport() {
      let url = getApiUrl();
      document.getElementById('reportContainer').innerHTML = '<div class="text-center text-sub py-4 font-mono">⏳ กำลังโหลดรายงาน...</div>';
      
      if(!url) {
        document.getElementById('reportContainer').innerHTML = '<div class="text-center text-danger py-4 font-mono">กรุณากรอก URL หลังบ้านด้านบนก่อน</div>';
        return;
      }

      callGAS('getReport', {}, function(res) {
        if(res.status !== 'success' || !res.data || res.data.length === 0) {
          document.getElementById('reportContainer').innerHTML = '<div class="text-center text-sub py-4 font-mono">ยังไม่มีข้อมูลรายงานในระบบ</div>';
          return;
        }
        let html = '';
        res.data.forEach(r => {
          let badgeClass = r.status === 'ครบ' ? 'badge-complete' : 'badge-incomplete';
          let snLine = r.serial && r.serial !== '-' ? `<small class="text-sub d-block font-mono">SN: ${r.serial}</small>` : '';
          html += `
            <div class="mb-3 p-3 rounded-4 bg-black border border-secondary border-opacity-25 font-mono text-start">
              <div class="d-flex justify-content-between mb-2">
                <small class="text-sub" style="font-size:0.75rem">${r.dateTime} | ${r.type}</small>
                <span class="${badgeClass}">${r.status}</span>
              </div>
              <div class="fw-bold text-white mb-1" style="font-size:0.85rem">${r.name}</div>
              ${snLine}
              <div class="mt-2 pt-2 border-top border-secondary border-opacity-25 d-flex justify-content-between small text-sub">
                 <span>ระบบ: <span class="text-white">${r.sysQty}</span></span>
                 <span>สแกน: <span class="text-white">${r.counted}</span></span>
                 <span>ผลต่าง: <span class="${r.diff !== 0 ? 'text-danger' : 'text-info'} fw-bold">${r.diff}</span></span>
              </div>
            </div>
          `;
        });
        document.getElementById('reportContainer').innerHTML = html;
      });
    }
  </script>
</body>
</html>
